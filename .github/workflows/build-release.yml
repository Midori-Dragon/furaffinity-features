name: Build Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository at release tag
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all modules
        run: npm run build:Browser-Extension-Rebuild

      - name: Package extension
        run: npm run package:Browser-Extension

      - name: Upload extension zip to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/furaffinity-features-extension.zip
